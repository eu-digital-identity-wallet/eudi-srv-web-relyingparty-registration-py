services:
  rp_registration:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      FLASK_RUN_PORT: 5000
      SERVICE_URL: 'http://127.0.0.1:5000/'
      #Container path
      TRUSTED_CAS_PATH: 'app\certs'
      LOG_PATH: 'app\logs'
      VERIFIER: 'verifier-backend.eudiw.dev'

      SCA_SIGNER_URL: ''
      URL_STATUSLIST: ''
      WRPRC_PRIVATEkEY: 'app/EJBCA/ecdsa_key.pem'
      WRPRC_CERTIFICATE: 'app/EJBCA/ecdsa_cert.pem'

      DB_HOST: 'host.docker.internal'
      DB_PORT: 3306
      DB_USER: ''
      DB_PASSWORD: '' 
      DB_NAME: 'wrp'

      #EJBCA Settings
      cahost: 
      clientP12ArchiveFilepath: '/app/EJBCA/namefile.p12'
      managementCA: '/app/EJBCA/namefile.pem'
      clientP12ArchivePassword: 
      EJBCA_username: 
      EJBCA_password: 
      # Values required by the endpoint '/pkcs10enroll':
      certificateProfileName: 
      endEntityProfileName: 

    # local path : container path
    volumes:
      - ./CAs:/app/certs/CAs
      # CA and .p12 local directory : directory path in container
      - ./EJBCA:/app/EJBCA


