  /wallet_rp/create:
    post:
      summary: Create Wallet Relying Party
      description: |
        Creates one or more Wallet Relying Party (WRP) objects.

        The `WalletRelyingParty` object follows the Wallet Relying Party
        definition described in the TS5 specification.

        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `WalletRelyingParty` | Collection of Wallet Relying Party objects. |

        ### WalletRelyingParty attributes (TS5)

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `tradeName` | string | Commercial name of the Wallet Relying Party. |
        | `provider_id` | integer | Reference to a previously registered Provider. |
        | `supervisoryAuthority` | integer | Reference to a previously registered Supervisory Authority. |
        | `registryURI` | string (URI) | Registry URI associated with the Wallet Relying Party. |
        | `supportURI` | array<string> | Support endpoint URI(s). |
        | `srvDescription` | array<object> | Localised description(s) of the Wallet Relying Party service. |
        | `intendedUse_ids` | array<integer> | References to Intended Use objects. |
        | `providesAttestations_id` | array<integer> | References to Provided Attestation objects. |
        | `usesIntermediary` | array<integer> | References to intermediary Wallet Relying Parties, when applicable. |
        | `entitlements` | array<string> | Entitlements supported by the Wallet Relying Party. |
        | `isPSB` | boolean | Indicates whether the Wallet Relying Party is a PSB. |
      tags:
        - WalletRelyingParty

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - WalletRelyingParty
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                WalletRelyingParty:
                  type: array
                  items:
                    type: object
                    required:
                      - supportURI
                      - provider_id
                      - srvDescription
                      - intendedUse_ids
                      - isPSB
                      - entitlements
                      - supervisoryAuthority
                      - registryURI
                    properties:
                      tradeName:
                        type: string
                        example: "My Wallet Service"

                      provider_id:
                        type: integer
                        example: 1

                      supervisoryAuthority:
                        type: integer
                        example: 1

                      registryURI:
                        type: string
                        format: uri
                        example: "https://registry.example.com"

                      supportURI:
                        type: array
                        items:
                          type: string
                          format: uri
                        example:
                          - "https://support.example.com"

                      srvDescription:
                        type: array
                        items:
                          type: object
                          required:
                            - lang
                          properties:
                            lang:
                              type: string
                              example: "en"
                            content:
                              type: string
                              example: "Wallet authentication service"

                      intendedUse_ids:
                        type: array
                        items:
                          type: integer
                        example: [1, 2]

                      providesAttestations_id:
                        type: array
                        items:
                          type: integer
                        example: [1]

                      usesIntermediary:
                        type: array
                        items:
                          type: integer
                        example: [1]

                      entitlements:
                        type: array
                        items:
                          type: string
                          enum:
                            - "https://uri.etsi.org/19475/Entitlement/Service_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/QEAA_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/Non_Q_EAA_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/PUB_EAA_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/PID_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/QCert_for_ESeal_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/QCert_for_ESig_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/rQSealCDs_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/rQSigCDs_Provider"
                            - "https://uri.etsi.org/19475/Entitlement/ESig_ESeal_Creation_Provider"

                      isPSB:
                        type: boolean
                        example: true

      responses:
        "200":
          description: Wallet Relying Party created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Wallet Relying Party created successfully
                  data:
                    type: array
                    items:
                      type: integer
                    example: [1]

        "400":
          description: Invalid input

        "401":
          description: Invalid hash_pid

        "403":
          description: Validation error (ownership, duplicates, invalid types)

