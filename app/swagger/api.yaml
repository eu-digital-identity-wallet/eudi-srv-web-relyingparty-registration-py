  /wrp:
    get:
      summary: Public search for Wallet Relying Parties (signed response)
      description: >
        Returns filtered Wallet Relying Parties. Response is signed using JWS (ES256).
        The response is NOT JSON but a signed token.
      tags:
        - Public
      parameters:
        - name: identifier
          in: query
          type: string
        - name: legalname
          in: query
          type: string
        - name: tradename
          in: query
          type: string
        - name: policy
          in: query
          type: string
        - name: entitlement
          in: query
          type: string
        - name: providesattestation
          in: query
          type: string
        - name: intendeduseidentifier
          in: query
          type: string
        - name: isintermediary
          in: query
          type: string
          enum: ["true", "false"]
        - name: usesintermediary
          in: query
          type: string

      responses:
        200:
          description: Signed JWS response (ES256)
          schema:
            type: string
            example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."
  
  /wrp/{identifier}:
    get:
      summary: Get WRP by Identifier (signed response)
      description: >
        Returns a Wallet Relying Party by identifier.
        The response is signed using ES256 JWS and must be verified using the public key.
      tags:
        - Public

      parameters:
        - name: identifier
          in: path
          required: true
          type: string
          example: "EU01-WRP-123"

      responses:
        200:
          description: Signed WRP object (JWS ES256)
          schema:
            type: string
            example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."

        404:
          description: WRP not found
          schema:
            type: object
            properties:
              status:
                type: string
                example: error
              code:
                type: integer
                example: 404
              message:
                type: string
                example: WRP not found

  /wrp/check-intended-use:
    get:
      tags:
        - Public
      summary: Check Intended Use
      description: |
        Verifies if a given combination of identifier, claim, credential and intended use exists.
        Returns a signed JWS response.

      parameters:
        - in: query
          name: identifier
          required: true
          schema:
            type: string
          description: Identifier of the WRP

        - in: query
          name: claim_path
          required: false
          schema:
            type: string
          description: Path of the claim

        - in: query
          name: credential_format
          required: false
          schema:
            type: string
          description: Format of the credential

        - in: query
          name: credential_meta
          required: false
          schema:
            type: string
          description: Metadata of the credential

        - in: query
          name: intended_use_identifier
          required: false
          schema:
            type: string
          description: Intended use identifier

      responses:
        "200":
          description: Signed verification result (JWS)
          content:
            application/json:
              schema:
                type: object
                description: JWS signed payload (string)
                example:
                  payload: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."

        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                example:
                  status: error
                  message: Missing required fields.
                  details: identifier

        "500":
          description: Internal server error
          
  /intended_use/certificate:
    post:
      tags:
        - Certificates
      summary: Generate Intended Use Registration Certificate
      description: |
        Generates a signed certificate (JAdES + COSE) for a given Intended Use.
        Returns both the signed document and COSE payload encoded in base64.

      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - hash_pid
              - intended_use_id
            properties:
              hash_pid:
                type: string
                example: "abc123hash"

              intended_use_id:
                type: integer
                example: 10

      responses:
        200:
          description: Certificate generated successfully
          schema:
            type: object
            properties:
              status:
                type: string
                example: success

              code:
                type: integer
                example: 200

              data:
                type: object
                properties:
                  filename:
                    type: string
                    example: document_with_signature.json

                  file_base64:
                    type: string
                    example: BASE64_ENCODED_SIGNED_DOCUMENT

                  cose_base64:
                    type: string
                    example: BASE64_ENCODED_COSE
                    
  /wallet_rp/certificate:
    post:
      tags:
        - Certificates

      summary: Generate Wallet Relying Party Certificate (PKCS#12)

      description: |
        Generates a certificate for a Wallet Relying Party using EJBCA.
        Returns a PKCS#12 (.p12) file encoded in base64.

      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - hash_pid
              - wrp_id
              - password

            properties:
              hash_pid:
                type: string
                example: "abc123hash"
                description: User session identifier

              wrp_id:
                type: integer
                example: 5
                description: Wallet Relying Party identifier

              password:
                type: string
                example: "StrongPassword123!"
                description: Password used to encrypt the PKCS#12 file

      responses:
        200:
          description: Certificate generated successfully
          schema:
            type: object
            properties:
              status:
                type: string
                example: success

              code:
                type: integer
                example: 200

              data:
                type: object
                properties:
                  filename:
                    type: string
                    example: document_with_signature.json

                  file_base64:
                    type: string
                    example: BASE64_ENCODED_P12_FILE

        400:
          description: Missing required fields
          schema:
            type: object
            properties:
              status:
                type: string
                example: error

              message:
                type: string
                example: Missing required fields.

              details:
                type: string
                example: wrp_id

        401:
          description: Invalid hash_pid

        403:
          description: Resource does not belong to the authenticated user

        500:
          description: Internal server error