  /credential/create:
    post:
      summary: Create Credential
      description: |
        Creates one or more Credential objects.

        The `Credential` object follows the Credential definition described in
        the TS5 specification.

        All parameters accepted by this endpoint correspond to the fields defined
        in the Credential table of the TS5 specification.

        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `credentials` | Collection of Credential objects. |

        ### Credential attributes (TS5)

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `format` | string | Credential format as defined in the TS5 specification. |
        | `meta` | string | Credential metadata. |
        | `claims` | array<object> | Collection of Claim objects associated with the Credential. |
        | `claims.path` | array<object> | JSON path identifying the claim within the Credential. |

      tags:
        - Credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - credentials
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                credentials:
                  type: array
                  description: Collection of Credential objects as defined in the TS5 specification.
                  items:
                    type: object
                    required:
                      - format
                      - meta
                      - claims
                    properties:
                      format:
                        type: string
                        description: Credential format as defined in the TS5 Credential specification.
                        example: "jwt_vc"

                      meta:
                        type: object
                        description: Credential metadata according to the TS5 Credential definition.
                        example:
                          vct_values:
                            - "urn:eudi:pid:1"

                      claims:
                        type: array
                        description: Collection of Claim objects associated with the Credential.
                        items:
                          type: object
                          required:
                            - path
                          properties:
                            path:
                              type: array
                              description: JSON path(s) identifying the claim within the Credential.
                              items:
                                type: string
                              example:
                                - "$.credentialSubject.family_name"
                                - "$.credentialSubject.given_name"

      responses:
        "200":
          description: Credential created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Credential created successfully
                  data:
                    type: array
                    items:
                      type: integer
                    example: [1, 2]

        "400":
          description: Invalid input or missing fields

        "401":
          description: Invalid hash_pid


  /credential/list:
    post:
      summary: List Credentials
      description: |
        Retrieves all Credential objects associated with the authenticated user.

        The returned Credential objects follow the Credential definition
        described in the TS5 specification.

