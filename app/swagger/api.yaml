  /supervisory_authority/create:
    post:
      summary: Create Supervisory Authority
      description: |
        Creates one or more Supervisory Authorities.

        The Supervisory Authority object represents the competent supervisory
        authority associated with a Wallet Relying Party.

        At least one contact method (`email`, `formURI` or `phone`) must be provided.

        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `supervisoryAuthority` | Collection of Supervisory Authority objects. |

        ### Supervisory Authority attributes

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `name` | string | Name of the Supervisory Authority. |
        | `country` | string | ISO 3166-1 alpha-2 country code. |
        | `email` | array<string> | Contact email addresses. |
        | `formURI` | array<string> | Contact form or website URLs. |
        | `phone` | array<string> | Contact telephone numbers. |

      tags:
        - Supervisory Authority

      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - hash_pid
              - supervisoryAuthority
            properties:

              hash_pid:
                type: string
                example: "abc123hash"
                description: Authenticated user session identifier.

              supervisoryAuthority:
                type: array
                description: Collection of Supervisory Authority objects.
                items:
                  type: object
                  required:
                    - name
                    - country
                  properties:

                    name:
                      type: string
                      example: "CNPD"
                      description: Name of the Supervisory Authority.

                    country:
                      type: string
                      example: "PT"
                      description: ISO 3166-1 alpha-2 country code.

                    email:
                      type: array
                      description: Contact email addresses.
                      items:
                        type: string
                      example:
                        - "geral@cnpd.pt"

                    formURI:
                      type: array
                      description: Contact form or website URLs.
                      items:
                        type: string
                      example:
                        - "https://www.cnpd.pt/contactos"

                    phone:
                      type: array
                      description: Contact telephone numbers.
                      items:
                        type: string
                      example:
                        - "+351213928400"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - supervisoryAuthority
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                supervisoryAuthority:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - country
                    properties:
                      name:
                        type: string
                        example: "CNPD"

                      country:
                        type: string
                        description: Must be a valid EU country code
                        example: "PT"

                      email:
                        type: array
                        items:
                          type: string
                          format: email
                        example:
                          - "geral@cnpd.pt"

                      formURI:
                        type: array
                        items:
                          type: string
                          format: uri
                        example:
                          - "https://www.cnpd.pt/contactos"

                      phone:
                        type: array
                        items:
                          type: string
                        example:
                          - "+351213928400"

      responses:
        "200":
          description: Supervisory Authority created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Supervisory Authority created successfully
                  data:
                    type: array
                    items:
                      type: integer
                    example: [1]

        "400":
          description: Invalid input or missing fields

        "401":
          description: Invalid hash_pid

        "403":
          description: Validation error (e.g., missing contact methods)

  /supervisory_authority/list:
    post:
      summary: List Supervisory Authorities
      description: |
