  /intended_use/create:
    post:
      summary: Create Intended Use
      description: |
        Creates one or more Intended Use objects.

        The `IntendedUse` object follows the Intended Use definition described in
        the TS5 specification.

        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `intended_uses` | Collection of Intended Use objects. |

        ### IntendedUse attributes (TS5)

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `intendedUseIdentifier` | string | Unique identifier of the Intended Use. |
        | `createdAt` | string (date-time) | Creation timestamp of the Intended Use. |
        | `revokedAt` | string (date-time) | Revocation timestamp of the Intended Use, if applicable. |
        | `purpose` | array<object> | Multilingual description of the Intended Use. |
        | `purpose.lang` | string | EU language code. |
        | `purpose.content` | string | Description of the Intended Use in the specified language. |
        | `privacyPolicy_id` | array<integer> | References to previously created Privacy Policy objects. |
        | `credential_ids` | array<integer> | References to previously created Credential objects defined according to the TS5 specification. |

      tags:
        - Intended Use

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - intended_uses
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                intended_uses:
                  type: array
                  items:
                    type: object
                    required:
                      - intendedUseIdentifier
                      - createdAt
                      - revokedAt
                      - purpose
                      - privacyPolicy_id
                      - credential_ids
                    properties:
                      intendedUseIdentifier:
                        type: string
                        example: "USE-001"

                      createdAt:
                        type: string
                        format: date
                        example: "2026-01-01"

                      revokedAt:
                        type: string
                        format: date
                        example: "2027-01-01"

                      purpose:
                        type: array
                        items:
                          type: object
                          required:
                            - lang
                            - content
                          properties:
                            lang:
                              type: string
                              description: Must be a valid EU language code
                              example: "en"
                            content:
                              type: string
                              example: "Identity verification"

                      privacyPolicy_id:
                        type: array
                        description: Must be valid intended_use policy types
                        items:
                          type: integer
                        example: [1, 2]

                      credential_ids:
                        type: array
                        items:
                          type: integer
                        example: [1, 2]

      responses:
        "200":
          description: Intended Use created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
