  /intended_use/certificate:
    post:
      tags:
        - Certificates

      summary: Generate Wallet Relying Party Registration Certificate (WRPRC)

      description: |
        Generates the Wallet Relying Party Registration Certificate (WRPRC)
        for the specified Intended Use.

        The certificate is signed using JAdES and COSE and is returned
        encoded in Base64 together with the signed document.
        
        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `intended_use_id` | Identifier of the Intended Use for which the Wallet Relying Party Registration Certificate (WRPRC) will be generated. |

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - intended_use_id
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                intended_use_id:
                  type: integer
                  description: Identifier of the Intended Use for which the Wallet Relying Party Registration Certificate (WRPRC) will be generated.
                  example: 10

      responses:
        "200":
          description: Certificate generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success

                  code:
                    type: integer
                    example: 200

                  data:
                    type: object
                    properties:
                      filename:
                        type: string
                        example: document_with_signature.json

                      file_base64:
                        type: string
                        example: BASE64_ENCODED_SIGNED_DOCUMENT

                      cose_base64:
                        type: string
                        example: BASE64_ENCODED_COSE

  /wallet_rp/certificate:
    post:
      tags:
        - Certificates

      summary: Generate Wallet Relying Party Attestation Certificate (WRPAC)

      description: |
        Generates a Wallet Relying Party Attestation Certificate (WRPAC)
        for the specified Wallet Relying Party using EJBCA.

        The generated certificate is returned as a PKCS#12 (.p12) file,
        encoded in Base64.

        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `wrp_id` | Identifier of the Wallet Relying Party for which the WRPAC will be generated. |
        | `password` | Password used to protect the generated PKCS#12 container. |

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - wrp_id
                - password
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                wrp_id:
                  type: integer
                  example: 5
                  description: Wallet Relying Party identifier

                password:
                  type: string
                  example: "StrongPassword123!"
                  description: Password used to encrypt the generated PKCS#12 (.p12) file.

      responses:
        "200":
          description: Certificate generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success

                  code:
                    type: integer
                    example: 200

                  data:
                    type: object
                    properties:
                      filename:
                        type: string
                        example: document_with_signature.json

                      file_base64:
                        type: string
                        example: BASE64_ENCODED_P12_FILE

        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error

                  message:
                    type: string
                    example: Missing required fields.

                  details:
                    type: string
                    example: wrp_id

        "401":
          description: Invalid hash_pid

        "403":
          description: Resource does not belong to the authenticated user

        "500":
          description: Internal server error

  /wrp:
    get:
      summary: Search Wallet Relying Parties
      description: |
        Searches for Wallet Relying Party (WRP) objects matching the supplied
        query parameters.

        The Wallet Relying Party object follows the Wallet Relying Party
        definition described in the TS5 specification.

        The response is digitally signed using JWS (ES256). As defined in the
        TS5 specification, the JWS payload contains an array of matching
        `WalletRelyingParty` objects.

        ### Query Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `identifier` | Wallet Relying Party identifier. |
        | `legalname` | Legal name of the Wallet Relying Party. |
        | `tradename` | Trade name of the Wallet Relying Party. |
        | `policy` | Policy identifier associated with the Wallet Relying Party. |
        | `entitlement` | Supported entitlement. |
        | `providesattestation` | Provided Attestation identifier. |
        | `intendeduseidentifier` | Intended Use identifier. |
        | `isintermediary` | Indicates whether the Wallet Relying Party acts as an intermediary. |
        | `usesintermediary` | Identifier of an intermediary Wallet Relying Party. |
      tags:
        - Public

      parameters:
        - name: identifier
          in: query
          schema:
            type: string

        - name: legalname
          in: query
          schema:
            type: string

        - name: tradename
          in: query
          schema:
            type: string

        - name: policy
          in: query
          schema:
            type: string

        - name: entitlement
          in: query
          schema:
            type: string

        - name: providesattestation
          in: query
          schema:
            type: string

        - name: intendeduseidentifier
          in: query
          schema:
            type: string

        - name: isintermediary
          in: query
          schema:
            type: string
            enum: ["true", "false"]

        - name: usesintermediary
          in: query
          schema:
            type: string

      responses:
        "200":
          description: |
            JWS (ES256) signed response.

            The JWS payload contains an array of matching
            `WalletRelyingParty` objects as defined in the TS5 specification.
          schema:
            type: string
            example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."

  /wrp/{identifier}:
    get:
      summary: Get Wallet Relying Party by Identifier
      description: |
        Retrieves a Wallet Relying Party identified by the supplied identifier.

        The returned Wallet Relying Party object follows the Wallet Relying Party
        definition described in the TS5 specification.

        As defined in the TS5 specification, the response is a signed JWT
        containing the Wallet Relying Party object.

        ### Path Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `identifier` | Unique identifier of the Wallet Relying Party. |
      tags:
        - Public

      parameters:
        - name: identifier
          in: path
          required: true
          schema:
            type: string
          example: "EU01-WRP-123"

      responses:
        "200":
          description: |
            Signed JWT containing the requested Wallet Relying Party object,
            as defined in the TS5 specification.
          schema:
            type: string
            example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."

        "404":
          description: WRP not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  code:
                    type: integer
                    example: 404
                  message:
                    type: string
                    example: WRP not found

  /wrp/check-intended-use:
    get:
      tags:
        - Public
      summary: Check Intended Use
      description: |
        Verifies whether a given combination of Wallet Relying Party identifier,
        Intended Use, Credential and Claim is registered.

        This endpoint follows the Intended Use verification procedure defined in
        the TS5 specification.

        The response is digitally signed using JWS (ES256). As defined in the
        TS5 specification, the JWS payload contains a boolean value (`true` or
        `false`) indicating whether the supplied combination exists.

        ### Query Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `identifier` | Wallet Relying Party identifier. |
        | `claim_path` | JSON path of the claim to verify. |
        | `credential_format` | Credential format as defined in TS5. |
        | `credential_meta` | Credential metadata associated with the credential. |
        | `intended_use_identifier` | Intended Use identifier to verify. |

      parameters:
        - in: query
          name: identifier
          required: true
          description: Identifier of the WRP
          schema:
            type: string

        - in: query
          name: claim_path
          description: Path of the claim
          schema:
            type: string

        - in: query
          name: credential_format
          description: Format of the credential
          schema:
            type: string

        - in: query
          name: credential_meta
          description: Metadata of the credential
          schema:
            type: string

        - in: query
          name: intended_use_identifier
          description: Intended use identifier
          schema:
            type: string

      responses:
        "200":
          description: |
            JWS (ES256) signed boolean response.

            The JWS payload contains either `true` or `false`, indicating whether
            the supplied Wallet Relying Party identifier, Intended Use, Credential
            and Claim combination exists, as defined in the TS5 specification.
          schema:
            type: string
            example: "eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..."

        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Missing required fields.
                  details:
                    type: string
                    example: identifier

        "500":
          description: Internal server error
