                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                policy:
                  type: array
                  items:
                    type: object
                    required:
                      - policyURI
                      - type
                      - intention
                    properties:
                      policyURI:
                        type: string
                        example: "https://example.com/privacy-policy"

                      intention:
                        type: string
                        enum:
                          - wrp
                          - intended_use
                        example: "wrp"
                        description: Defines the purpose of the policy

                      type:
                        type: string
                        enum:
                          - "http://data.europa.eu/eudi/policy/trust-service-practice-statement"
                          - "http://data.europa.eu/eudi/policy/terms-and-conditions"
                          - "http://data.europa.eu/eudi/policy/privacy-statement"
                          - "http://data.europa.eu/eudi/policy/privacy-policy"
