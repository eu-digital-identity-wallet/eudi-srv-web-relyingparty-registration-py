        ### Policy attributes (TS5)

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `policyURI` | string | URI identifying the policy. |
        | `type` | string | Policy type defined by TS5. |
        | `intention` | string | Intended purpose of the policy (e.g. `wrp` or `intended_use`). |
