        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - providesAttestations
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                providesAttestations:
                  type: array
                  items:
                    type: object
                    required:
                      - format
                      - meta
                    properties:
                      format:
                        type: string
                        example: "jwt"
                        description: Credential format (e.g., jwt, sd-jwt, mdoc)

                      meta:
                        type: object
                        example:
                          vct_values:
                            - "urn:eudi:pid:1"

