        The `providesAttestations` object follows the Provided Attestation
        definition described in the TS5 specification.

        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `providesAttestations` | Collection of Provided Attestation objects. |

        ### Provided Attestation attributes (TS5)

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `format` | string | Credential format supported by the attestation as defined in TS5. |
        | `meta` | string | Metadata associated with the provided attestation as defined in TS5. |
      tags:
