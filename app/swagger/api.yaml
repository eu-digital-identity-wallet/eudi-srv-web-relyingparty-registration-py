  /provider/create:
    post:
      summary: Create Provider
      description: |
        Creates one or more Providers.

        The Provider object follows the Provider definition described in the TS5 specification.

        ### Request Parameters

        | Parameter | Description |
        |-----------|-------------|
        | `hash_pid` | Authenticated user session identifier. |
        | `provider` | Collection of Provider objects. |

        ### Provider attributes (TS5)

        | Attribute | Type | Description |
        |-----------|------|-------------|
        | `legalEntityId` | integer | Identifier of the Legal Entity associated with the Provider. |
        | `providerType` | string | Type of Provider defined by TS5. |
        | `policy_id` | array<integer> | References to Policy objects previously registered. Only policies with intention `wrp` are accepted. |
        | `x5c` | array<string> | Optional X.509 certificate chain associated with the Provider. |
      tags:
        - Provider
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - hash_pid
              - provider
            properties:
              hash_pid:
                type: string
                example: "abc123hash"
                description: Authenticated user session identifier.

              provider:
                type: array
                description: Collection of Provider objects as defined in the TS5 specification.
                items:
                  type: object
                  required:
                    - legalEntityId
                    - providerType
                    - policy_id
                  properties:
                    legalEntityId:
                      type: integer
                      description: Identifier of the Legal Entity associated with the Provider. The Legal Entity must belong to the authenticated user.
                      example: 1

                    providerType:
                      type: string
                      description: Provider type defined by the TS5 specification.
                      example: "WALLET_PROVIDER"

                    policy_id:
                      type: array
                      description: List of Policy IDs associated with the Provider. All policies must belong to the authenticated user and have intention `wrp`.
                      items:
                        type: integer
                      example: [1, 2]

                    x5c:
                      type: array
                      description: Optional X.509 certificate chain encoded as Base64.
                      items:
                        type: string
                      example:
                        - "MIIC...base64cert1"
                        - "MIIC...base64cert2"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hash_pid
                - provider
              properties:
                hash_pid:
                  type: string
                  description: Authenticated user session identifier.
                  example: "abc123hash"

                provider:
                  type: array
                  items:
                    type: object
                    required:
                      - legalEntityId
                      - providerType
                      - policy_id
                    properties:
                      legalEntityId:
                        type: integer
                        example: 1

                      providerType:
                        type: string
                        example: "WALLET_PROVIDER"

                      policy_id:
                        type: array
                        description: Must be policies with intention 'wrp'
                        items:
                          type: integer
                        example: [1, 2]

                      x5c:
                        type: array
                        description: Certificate chain (optional)
                        items:
                          type: string
                        example:
                          - "MIIC...base64cert1"
                          - "MIIC...base64cert2"

      responses:
        "200":
          description: Provider created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Provider created successfully
                  data:
                    type: array
                    items:
                      type: integer
                    example: [1]

        "400":
          description: Invalid input or missing fields

        "401":
          description: Invalid hash_pid

        "403":
          description: Resource does not belong to user or invalid policy type


